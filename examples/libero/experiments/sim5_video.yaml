# Experiment batch config for run_experiments.py (LIBERO simulation)
#
# Task 5: search inside the baskets for the butter. Video-encoder variant of sim5.yaml;
# see sim5.yaml for the text/keyframe/no_memory ablations.
#
# Run:
#   uv run examples/libero/run_experiments.py examples/libero/experiments/sim5_video.yaml

# NOTE: bddl_file paths below are relative to the directory you run the command
# from (the openpi repo root) and assume LIBERO is checked out as a sibling
# directory (../LIBERO), matching the default lookup in libero_inference.py.
# Set the LIBERO_REPO_PATH env var, or edit these paths, if your layout differs.

defaults:
  host: "127.0.0.1"
  port: 8000
  num_rollouts: 25
  max_episode_steps: 800
  save_video: true
  video_out_path: "data/libero/videos"
  video_encoder: true
  num_frames: 4
  seed: -1
  infer_every_steps: 10
  num_steps_wait: 50
  stride_steps: 60
  server:
    config: "libero_mem5_video_infer"
    dir: "checkpoints/libero_mem5_video/vid5/19999"

experiments:

  - name: "task5_left_base"
    bddl_file: "../LIBERO/libero/libero/bddl_files/memory/task5_search1.bddl"
    mode: "no_memory"

  - name: "task5_left_video"
    bddl_file: "../LIBERO/libero/libero/bddl_files/memory/task5_search1.bddl"
    mode: "video"

  - name: "task5_right_base"
    bddl_file: "../LIBERO/libero/libero/bddl_files/memory/task5_search2.bddl"
    mode: "no_memory"

  - name: "task5_right_video"
    bddl_file: "../LIBERO/libero/libero/bddl_files/memory/task5_search2.bddl"
    mode: "video"
