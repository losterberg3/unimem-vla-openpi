# Experiment batch config for run_experiments.py (LIBERO simulation)
#
# Task 1: pick up box, retract arm, put box back down.
#
# Run:
#   uv run examples/libero/run_experiments.py examples/libero/experiments/sim1.yaml
#   uv run examples/libero/run_experiments.py examples/libero/experiments/sim1.yaml --dry-run

# NOTE: bddl_file paths below are relative to the directory you run the command
# from (the openpi repo root) and assume LIBERO is checked out as a sibling
# directory (../LIBERO), matching the default lookup in libero_inference.py.
# Set the LIBERO_REPO_PATH env var, or edit these paths, if your layout differs.

defaults:
  host: "127.0.0.1"
  port: 8000
  num_rollouts: 25
  max_episode_steps: 800
  save_video: true
  video_out_path: "data/libero/videos"
  event_confidence_threshold: 0.8
  video_encoder: true
  num_frames: 3
  scoring:
    type: "event_completion"
    vlm_sequence:
      - "grabbed box"
      - "retracted"
      - "placed box"
  seed: -1
  infer_every_steps: 10
  num_steps_wait: 50
  bddl_file: "../LIBERO/libero/libero/bddl_files/memory/task1_pick_up_and_put_back_down.bddl"
  server:
      config: "libero_mem1"
      dir: "checkpoints/libero_mem1_finetune/mem1/14000"

experiments:
  - name: "task1_keyframe"
    mode: "keyframe"

  - name: "task1_text"
    mode: "text"

  - name: "task1_ours"
    mode: "text_keyframe"

  - name: "base"
    mode: "no_memory"
